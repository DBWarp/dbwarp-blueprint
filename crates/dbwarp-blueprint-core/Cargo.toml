[package]
name = "dbwarp-blueprint-core"
version = "0.2.0"
edition = "2021"
description = "Shared DBWarp Blueprint TOML model and deterministic synthetic generation primitives"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
parquet = { version = "58.3.0", optional = true }
apache-avro = { version = "0.21", optional = true }
zstd = { version = "0.13", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
num-bigint = { version = "0.4", optional = true }
serde_json = { version = "1", optional = true }

[features]
default = []
parquet = ["dep:parquet"]
avro = ["dep:apache-avro", "dep:num-bigint", "dep:serde_json", "dep:chrono"]
sampling = ["dep:zstd", "dep:chrono"]
file-formats = ["parquet", "avro", "sampling"]

[package]
name = "dbwarp-blueprint"
version = "1.6.0"
edition = "2021"
rust-version = "1.94.0"
authors = ["DBWarp <info@dbwarp.com>"]
license = "Apache-2.0 OR MIT"
description = "Database Blueprint collector for DBWarp migration planning."
repository = "https://github.com/DBWarp/dbwarp-blueprint"
readme = "README.md"

[[bin]]
name = "dbwarp-blueprint"
path = "src/main.rs"

[dependencies]
anyhow = "1"
anstream = "1"
anstyle = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
glob = "0.3"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
libc = "0.2"
mysql_async = { version = "0.34", default-features = false, features = ["minimal", "rustls-tls"] }
regex = "1"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "logging", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tokio-postgres-rustls = "0.13"
tokio-util = { version = "0.7", features = ["compat"] }
toml = { version = "0.8", default-features = false, features = ["display", "parse"] }
webpki-roots = "0.26"
zeroize = "1"
zstd = "0.13"
dbwarp-blueprint-core = { path = "crates/dbwarp-blueprint-core", features = ["file-formats"] }
mimalloc = "0.1.52"

[patch.crates-io]
libgssapi-sys = { path = "vendor/libgssapi-sys" }
mysql_async = { path = "vendor/mysql_async" }
tiberius = { path = "vendor/tiberius" }
winauth = { path = "vendor/winauth" }

[features]
default = []
# Linux Kerberos auth via tiberius + libgssapi. Building requires the
# development headers. The release binary loads the platform GSSAPI runtime
# only when integrated authentication is selected. Build with
# `cargo build --release --features integrated-auth-gssapi`.
integrated-auth-gssapi = ["tiberius/integrated-auth-gssapi"]
# Windows SSPI auth via tiberius. SSPI is built into Windows so no
# external prerequisite. Build with `--features winauth` on Windows
# targets only.
winauth = ["tiberius/winauth"]

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = "symbols"
codegen-units = 1
incremental = false

[profile.release.package.zstd-sys]
opt-level = 3
